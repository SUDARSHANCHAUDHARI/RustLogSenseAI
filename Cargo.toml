[package]
name = "logscope"
version = "1.1.0"
edition = "2021"
authors = ["Sudarshan Chaudhari <sunny.sudarshan@gmail.com>"]
description = "Log parser and analyzer — detect anomalies, count errors, produce summaries"
license = "MIT"
repository = "https://github.com/SUDARSHANCHAUDHARI/RustLogSenseAI"
readme = "README.md"
keywords = ["logs", "parser", "anomaly", "cli", "analysis"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "logscope"
path = "src/lib.rs"

[[bin]]
name = "logscope"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
regex = "1"
colored = "2"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
